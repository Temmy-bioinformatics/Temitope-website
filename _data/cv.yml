cv:
  name: Temitope O. Oriowo
  label: Computational Biologist & Bioinformatician
  email: ooriowotemitope@gmail.com
  location: Bonn, North Rhine-Westphalia, Germany
  image: ""
  summary: >
    Computational biologist and bioinformatician with 5+ years of experience
    in genomics, bioinformatics, and large-scale biological data analysis.
    Experienced in genome assembly, population genomics, comparative genomics,
    phylogenomics, and reproducible workflow development, including analysis of
    approximately 700 whole genomes. Proficient in R, Python, Bash, Linux,
    Snakemake, and HPC environments using SLURM and SGE.

  social_networks:
    - network: LinkedIn
      username: temitope-oriowo
    - network: GitHub
      username: Temmy-bioinformatics

  sections:
    Education:
      - institution: Rhenish Friedrich Wilhelm University of Bonn
        location: Bonn, Germany
        area: Bioinformatics & Genomics
        studyType: PhD in Biology
        start_date: 2022
        end_date: 2026
        highlights:
          - Doctoral research conducted at the Leibniz Institute for the Analysis of Biodiversity Change
          - Research focused on genome evolution, population genomics, hybridisation, introgression, and species boundaries

      - institution: Wageningen University & Research / University of Natural Resources and Life Sciences (BOKU)
        location: Wageningen, Netherlands & Vienna, Austria
        area: Animal Breeding and Genetics
        studyType: M.Sc. (Erasmus Mundus Joint Degree)
        start_date: 2019
        end_date: 2021

      - institution: Bowen University
        location: Iwo, Nigeria
        area: Animal Science
        studyType: B.Agric.
        start_date: 2013
        end_date: 2017

    Experience:
      - company: Leibniz Institute for the Analysis of Biodiversity Change
        position: Doctoral Researcher
        location: Bonn, Germany
        start_date: 2022-05-01
        end_date: ""
        highlights:
          - Developed and maintained reproducible Snakemake workflows for genome assembly, annotation, population genomics, and comparative genomics
          - Developed a chromosome-level, haplotype-resolved reference genome using PacBio HiFi, Hi-C, and RNA-Seq data
          - Analysed approximately 700 whole genomes, performing read processing, variant discovery, quality control, population structure, admixture, introgression, and k-mer-based analyses
          - Conducted comparative genomics and phylogenomics using genomic and proteomic datasets to investigate evolutionary relationships and gene family evolution
          - Applied statistical and computational approaches to investigate population structure, genetic diversity, gene flow, hybridisation, and species boundaries
          - Developed analysis scripts and visualisation workflows in R, Python, and Bash for large-scale genomic datasets
          - Executed and scaled computational workflows on Linux-based HPC systems using SLURM and SGE
          - Collaborated with researchers across disciplines to troubleshoot bioinformatics workflows, debug scripts, and communicate computational results

      - company: Hendrix Genetics
        position: Bioinformatics Intern
        location: Boxmeer, Netherlands
        start_date: 2019-12-01
        end_date: 2020-03-01
        highlights:
          - Contributed to genetic and genomic analyses supporting turkey breeding programmes, including novel phenotyping approaches
          - Assisted in developing data-processing workflows and statistical models for genomic selection
          - Supported the analysis and interpretation of high-throughput sequencing data in a quantitative genetics context
          - Prepared scientific reports and presentations for internal teams and stakeholders

