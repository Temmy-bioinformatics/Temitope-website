        end_date: ""
        summary: ""
        highlights:
          - Developed and maintained Snakemake pipelines for genome assembly, annotation, and population genomics workflows, ensuring scalability and reproducibility
          - Assembled and annotated a haplotype-resolved reference genome using PacBio HiFi, Hi-C, and RNA-Seq data
          - Conducted population-scale variant discovery and analysis on ~700 genomes, including QC, alignment, variant calling, population structure, introgression, and k-mer-based analysis
          - Performed comparative genomics and phylogenomic analysis using custom and public proteomes to identify gene family expansions and contractions
          - Produced high-quality visualizations and reports to communicate results to internal teams and external stakeholders
          - Proficient in Bash, Python, and R, and experienced with SLURM and SGE-based HPC environments
          - Collaborated with cross-functional teams to troubleshoot bioinformatics workflows and debug scripts and pipelines

      - company: Hendrix Genetics
        position: Bioinformatics Intern
        location: Boxmeer, Netherlands
        start_date: 2019-12-01
        end_date: 2020-03-01
        highlights:
          - Contributed to genetic and genomic analyses supporting turkey breeding programs, focusing on novel phenotyping approaches
          - Assisted in developing data processing workflows and statistical models for genomic selection
          - Supported the interpretation of high-throughput sequencing data in a quantitative genetics context
          - Prepared scientific reports and presentations for internal teams and external stakeholders

