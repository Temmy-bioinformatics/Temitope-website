  summary: Computational biologist and bioinformatician with 5+ years of experience in genomics, bioinformatics, and large-scale biological data analysis. Experienced in genome assembly, population genomics, comparative genomics, phylogenomics, and reproducible workflow development, including analysis of approximately 700 whole genomes. Proficient in R, Python, Bash, Linux, Snakemake, and HPC environments using SLURM and SGE.

